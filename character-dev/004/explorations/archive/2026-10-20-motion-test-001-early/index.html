<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little KC — Motion Test 001</title>
<style>
  :root { --bg: #fdf4e2; --ink: #2b211c; --muted: #7a685b; --line: #e3d3bd; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font: 13px/1.4 Menlo, ui-monospace, monospace; letter-spacing: .06em;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; }
  canvas { display: block; width: min(86vw, calc((100vh - 150px) * 860 / 1140)); height: auto; }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; letter-spacing: inherit; color: var(--ink); background: transparent;
           border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  input[type=range] { width: min(320px, 60vw); accent-color: var(--ink); }
  .time { color: var(--muted); min-width: 4.5em; text-align: right; font-variant-numeric: tabular-nums; }
  h1 { font-size: 13px; font-weight: 700; margin: 0; letter-spacing: .18em; }
</style>
</head>
<body>
<h1>LITTLE KC — MOTION TEST 001</h1>
<canvas id="stage" width="860" height="1140" aria-label="Little KC seated with guitar, singing"></canvas>
<div class="bar">
  <button id="play">Pause</button>
  <button id="replay">Replay</button>
  <span style="width:8px"></span>
  <button data-speed="1" aria-pressed="true">1×</button>
  <button data-speed="0.5">½×</button>
  <button data-speed="0.25">¼×</button>
</div>
<div class="bar">
  <input id="scrub" type="range" min="0" max="3000" value="0" aria-label="Timeline">
  <span class="time" id="time">0.00s</span>
</div>
<script>
// Two approved drawings (identical except the face) on one body plate.
// Motion = gentle row-based deformation of the upper body (breath, lean) + a near-cut face change
// timed to the fastest moment of the lean. No pixels are painted.
const SRC = '../../chatgpt/';
const CROP = { x: 220, y: 40, w: 860, h: 1140 };   // figure framing, in source px
const NECK = 470, HIPS = 820;                     // rigid above NECK, fades to fixed at HIPS
const DUR = 3.0;

// keyframes: [time s, value px]. rise = upward, lean = forward (screen right) + slightly down
const RISE = [[0, 0], [0.25, 0], [0.95, 1.2], [1.55, 5.0], [1.68, 5.0], [2.30, -1.6], [3.0, -0.8]];
const LEAN = [[0, 0], [1.58, 0], [2.18, 4.5], [3.0, 3.6]];
const CUT_AT = 1.80, CUT_LEN = 0.05;               // face change: ~3 frames at 60fps

const ease = t => 0.5 - 0.5 * Math.cos(Math.PI * t);
function curve(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1] = keys[i], [t0, v0] = keys[i - 1];
    if (t <= t1) return v0 + (v1 - v0) * ease((t - t0) / (t1 - t0));
  }
  return keys[keys.length - 1][1];
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

const stage = document.getElementById('stage'), ctx = stage.getContext('2d');
const frame = document.createElement('canvas'), fctx = frame.getContext('2d');
const load = f => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = SRC + f; });

let neutral, singing, t = 0, playing = true, speed = 1, last = null;

function render() {
  // breathing never fully stops: a tiny idle swell under everything
  const idle = 0.5 * Math.sin(t * 2 * Math.PI / 2.6);
  const rise = curve(RISE, t) + idle;
  const sway = 0.6 * Math.sin(Math.max(0, t - 2.2) * 2 * Math.PI / 1.8) * smooth(2.2, 2.6, t);
  const lean = curve(LEAN, t) + sway;
  const face = smooth(CUT_AT - CUT_LEN / 2, CUT_AT + CUT_LEN / 2, t);

  fctx.globalAlpha = 1; fctx.drawImage(neutral, 0, 0);
  if (face > 0) { fctx.globalAlpha = face; fctx.drawImage(singing, 0, 0); }

  ctx.drawImage(frame, CROP.x, CROP.y, CROP.w, CROP.h, 0, 0, CROP.w, CROP.h);
  for (let y = CROP.y; y < HIPS; y++) {
    const w = y <= NECK ? 1 : 1 - smooth(NECK, HIPS, y);
    const sy = y + (rise - lean * 0.45) * w;      // positive = content moves up
    ctx.drawImage(frame, CROP.x, sy, CROP.w, 1, lean * w, y - CROP.y, CROP.w, 1);
  }
}

const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
function sync() { scrub.value = Math.round(t * 1000); timeEl.textContent = t.toFixed(2) + 's'; playBtn.textContent = playing ? 'Pause' : 'Play'; }
function tick(now) {
  if (playing) {
    if (last !== null) t += (now - last) / 1000 * speed;
    if (t >= DUR) { t = DUR; playing = false; }
    render(); sync();
  }
  last = now; requestAnimationFrame(tick);
}
playBtn.onclick = () => { if (!playing && t >= DUR) t = 0; playing = !playing; sync(); };
document.getElementById('replay').onclick = () => { t = 0; playing = true; render(); sync(); };
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => {
  speed = +b.dataset.speed;
  document.querySelectorAll('[data-speed]').forEach(o => o.setAttribute('aria-pressed', o === b));
});
scrub.oninput = () => { t = scrub.value / 1000; playing = false; render(); sync(); };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playBtn.click(); } });

Promise.all([load('07-seated-01-neutral.webp'), load('07-seated-03-singing.webp')]).then(([n, s]) => {
  neutral = n; singing = s; frame.width = n.naturalWidth; frame.height = n.naturalHeight;
  render(); sync(); setTimeout(() => { last = null; requestAnimationFrame(tick); }, 500);
});
</script>
</body>
</html>
