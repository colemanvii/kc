<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>PUNCHERS · Shot Proof</title>
    <link rel="icon" href="data:," />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="proof">
      <nav class="episodes" aria-label="Episodes"></nav>
      <div class="screen">
        <canvas class="picture" aria-label="Episode preview"></canvas>
        <div class="guides" hidden>
          <div class="guide guide--action"></div>
          <div class="guide guide--title"></div>
        </div>
      </div>
      <section class="transport" aria-label="Transport">
        <div class="row">
          <button class="play" type="button" aria-label="Play">play</button>
          <output class="tc">00:00:00:00</output>
          <output class="bb">1 · 1</output>
          <output class="shot">SH010</output>
          <span class="spacer"></span>
          <label class="toggle"><input type="checkbox" class="click" checked /> click</label>
          <label class="toggle"><input type="checkbox" class="show-guides" /> guides</label>
        </div>
        <div class="scrub" role="slider" tabindex="0" aria-label="Scrub" aria-valuemin="0">
          <div class="bars"></div>
          <div class="shots"></div>
          <div class="head"></div>
        </div>
        <p class="note"></p>
        <p class="missing"></p>
        <p class="status"></p>
      </section>
    </main>
  </body>
</html>
