<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efdec9" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <title>The Arrival</title>
    <meta name="description" content="Little KC arrives — a motion study from Cole's original drawing, for Kashus Culpepper." />
    <link rel="icon" href="data:," />
    <link rel="preload" as="image" href="/little-kc/derived/figure.png" fetchpriority="high" />
    <script>
      // Hide the figure before first paint so motion visitors begin on empty paper.
      // Failsafe: if the script never runs, reveal the drawing at rest.
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('is-staged');
        setTimeout(function () { if (!window.arrivalBooted) document.documentElement.classList.remove('is-staged'); }, 6000);
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="arrival">
      <h1 class="visually-hidden">The Arrival</h1>
      <div class="stage"></div>
      <button class="replay" type="button" hidden>again</button>
    </main>
    <noscript>
      <style>.stage { display: none; } .noscript-art { display: block; width: min(92vw, 80svh); margin: 6svh auto; }</style>
      <img class="noscript-art" src="/bea8729f-ce73-440b-804f-88e87d98273d.jpeg" alt="Little KC floating beneath a red balloon with devil horns and a blue balloon with a halo." />
    </noscript>
  </body>
</html>
